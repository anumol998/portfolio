services:
  rsync:
    build:
      context: .
      dockerfile: Dockerfile.rsync
    image: rsync-tool
    stdin_open: true
    tty: true
    volumes:
      - ./dist:/src:ro
      - ${SSH_KEY_DIR}:/ssh-keys:ro
    entrypoint: ["sh", "-c"]
    command: >
      "mkdir -p /root/.ssh &&
      cp /ssh-keys/${SSH_KEY_NAME} /root/.ssh/id_rsa &&
      chmod 600 /root/.ssh/id_rsa &&
      rsync -avz --delete -e 'ssh -o StrictHostKeyChecking=no -i /root/.ssh/id_rsa -p ${SSH_PORT}'
      /src/ ${REMOTE_USER}@${REMOTE_HOST}:${REMOTE_PATH}/"

# Usage:
# docker compose -f docker-compose.rsync.yml --env-file .env run --rm rsync